name: Gerar dados de Poliomielite

on:
  push:
    branches: [main]
    paths:
      - "src/data/Poliomielite_2026.xlsx"
      - "scripts/generate-vacinacao.mjs"
      - ".github/workflows/gerar-dados-poliomielite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate JSON
        run: node scripts/generate-vacinacao.mjs

      - name: Save generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/vacinacao.json
          git diff --cached --quiet && exit 0
          git commit -m "Gera banco de dados de Poliomielite"
          git push
