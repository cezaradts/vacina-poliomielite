name: Atualizar dados da vacinação

on:
  push:
    paths:
      - "src/data/Poliomielite_2026.xlsx"
      - ".github/workflows/atualizar-dados.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Atualizar vacinacao.json a partir do Excel
        run: |
          node <<'NODE'
          const XLSX = require("xlsx");
          const fs = require("fs");

          const excelFile = "src/data/Poliomielite_2026.xlsx";
          const jsonFile = "src/data/vacinacao.json";

          const workbook = XLSX.readFile(excelFile);
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });

          const monthRow = rows[1];
          const months = [];
          for (let col = 2; col < monthRow.length; col += 3) {
            const serial = monthRow[col];
            if (typeof serial !== "number") continue;
            const date = XLSX.SSF.parse_date_code(serial);
            if (date) months.push(`${date.y}-${String(date.m).padStart(2, "0")}`);
          }

          const old = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
          const names = new Map(old.rows.map(r => [String(r.code).padStart(6, "0"), { name: r.name, uf: r.uf }]));
          const output = [];

          for (let i = 4; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row[1] == null || row[1] === "") continue;
            const code = String(row[1]).replace(".0", "").padStart(6, "0");
            const known = names.get(code);
            if (!known) continue;

            const municipality = { code, name: known.name, uf: known.uf, months: {} };
            for (let j = 0; j < months.length; j++) {
              const base = 2 + j * 3;
              municipality.months[months[j]] = {
                v: Number(row[base + 1]) || 0,
                p: Number(row[base + 2]) || 0
              };
            }
            output.push(municipality);
          }

          fs.writeFileSync(jsonFile, JSON.stringify({ months, rows: output }, null, 2) + "\n");
          console.log("MESES:", months);
          console.log("MUNICÍPIOS GERADOS:", output.length);
          console.log("JSON GERADO A PARTIR DO EXCEL.");
          NODE

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/vacinacao.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
          else
            git commit -m "Atualiza dados de vacinação pelo Excel"
            git push
          fi
